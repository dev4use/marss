[pytest]
bdd_features_base_dir = Features/
testpaths = 
    Tests
markers =
    nominal: cas nominal par défaut
    alternatif: chemin alternatif
    robustesse: supporte des entorses non bloquantes
    erreur: provocation d'erreur signalée
addopts = -s -vv --gherkin-terminal-reporter --cucumberjson=Tests/Report/result.json --bdd-report="Tests/Report/report.html"
