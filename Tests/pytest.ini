[pytest]
pythonpath = .
bdd_features_base_dir = Features/
testpaths = 
    Tests
markers =
    nominal: cas nominal par défaut
    alternatif: chemin alternatif ou moins fréquent
    robustesse: supporte des entorses non bloquantes
    erreur: provocation d'erreur signalée
addopts = -s -vv --gherkin-terminal-reporter --cucumberjson=Tests/Report/result.json --bdd-report="Tests/Report/report.html" --markdown-report=Doc/test-report.md --markdown-report-verbose --junitxml=Doc/junit.xml --debug=Logs/trace --cov=Code --cov-config=Tests/.coveragerc --cov-report html:Tests/Report/coverage --cov-report markdown:Doc/coverage.md --cov-report xml:Doc/coverage.xml
